<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Signup Form</h1>

    <form action="class3.html" method="get">
        <table>
            <tr>
                <td>
                    <label for="email">name</label>
                </td>
                <td>
                    <input type="text" name="" id="email" placeholder="enter name" aria-label="name"
                        aria-required="true" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">email</label>
                </td>
                <td>
                    <input type="email" name="" id="email" placeholder="enter email" required />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">password (*)</label>
                </td>
                <td>
                    <input type="password" name="" id="password" placeholder="enter password" required />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="image">image</label>
                </td>
                <td>
                    <input type="file" name="" id="image" placeholder="enter image" required accept="image/png, image/jpeg" />
                </td>
            </tr>


            <tr>
                <td>
                    <label for="country">country</label>
                </td>
                <td>
                    <select name="" id="">
                        <option value="" selected disabled>Choose Country</option>
                        <option value="pk">pakistan</option>
                        <option value="china">china</option>
                        <option value="india">india</option>
                        <option value="iran">iran</option>
                    </select>
                    <!-- <input type="file" name="" id="image" placeholder="enter image" required accept="/*jpg,png" /> -->
                </td>
            </tr>

            <tr>
                <td>
                    <button type="button">button</button>
                </td>
                <!-- <td>
                    <span>
                        <sup>1</sup> H <sub>elem</sub>
                    </span>
                </td> -->

            </tr>

        </table>





    </form>


</body>

</html>
