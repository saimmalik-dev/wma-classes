<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 32</title>

    <style>
        .grid-container {
            border: 1px solid red;
            display: grid;
            grid-template-rows: 1fr 2fr 1fr;
            /* 400/4=> 100px = 1fr */
            grid-template-columns: 1fr 3fr;
            /* gap: 10px; */
        }



        .grid-items {
            border: 2px solid black;
            min-height: 100px;
        }


        .header {
            grid-column: 1/3;
        }



        .footer {
            grid-column: 1/3;
        }

        h1{
            margin: 0;
        }

    </style>

</head>

<body>
    <div class="grid-container">
        <div class="grid-items header"> Header Class 32</div>
        <div class="grid-items left">Left</div>
        <div class="grid-items right">
            <h1>Heading</h1>
        </div>
        <div class="grid-items footer">Footers</div>
    </div>
</body>

</html>
