<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 26
        
    </title>
    
    <style>
        .grid-container {
            border: 2px solid red;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            /* grid-template-rows: 1fr 1fr 1fr 1fr; */
            /* grid-template-columns: 1fr 2fr 1fr;  1+2+1=4 */
            /* justify-items: center; */
        }

        .grid-items {
            border: 1px solid black;
            /* width: 100px; */
            min-height: 100px;
            color: white;
        }

        .item-1 {
            /* grid-column: 1/3; 1-3 */
            grid-column: 1/3;
            grid-row: 1;
            border: 2px solid black;
        }

        .item-2 {
            grid-column: 2/4;
            grid-row: 1/3;
            opacity: .6;
            border: 2px solid black;
        }

        .item-3 {
            grid-column: 1;
            /* grid-row: 2/5; */
            grid-row: span 3;
            border: 2px solid black;
        }


        .item-4 {
            grid-column: 3;
            grid-row: 3;
            border: 2px solid black;
        }


        .item-5 {
            grid-column: 2;
            grid-row: 4;
            border: 2px solid black;
        }

        .item-6 {
            grid-column: 3;
            grid-row: 4;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="grid-container">

        <div class="grid-items item-1  " style="background-color: red;">1</div>
        <div class="grid-items item-2" style="background-color: blue;">2</div>
        <div class="grid-items item-3 " style="background-color: green;">3</div>
        <div class="grid-items item-4" style="background-color: yellow;">4</div>
        <div class="grid-items item-5 " style="background-color: purple;">5</div>
        <div class="grid-items item-6 " style="background-color: orange;">6</div>
    </div>
</body>

</html>
